<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/pp-github.png" />
    <!-- The ital axis is required: index.css sets font-synthesis: none, so
         without a real italic face <em> and fontStyle: "italic" render
         identically to regular text -- and font-synthesis disables faked
         *weight* too, which is why every bold weight in use is requested here.
         Check a candidate family actually serves italics before switching:
         Google Fonts answers ?family=Space+Grotesk:ital,... with a 200 and no
         italic @font-face at all, so the URL alone proves nothing.
         Mono is Plex's own, so `code` matches the body text it sits in. -->
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400;1,700&display=swap" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hello, I'm Zian Tsabit 👋</title>
    <script>
      // Applies the stored colour scheme before first paint, so a returning
      // visitor never sees the wrong background flash. Must stay in sync with
      // MUI's storage keys ("mui-mode", "mui-color-scheme-dark") and with
      // colorSchemeSelector ("class"). Visitors with no stored choice get
      // light, which index.css already paints on bare `html`, so nothing is
      // done for them here.
      //
      // Two keys rather than one, because there are three schemes and only two
      // modes. `rain` is a dark-mode scheme (see useSiteTheme), so a visitor
      // who chose it has mode "dark" and dark-scheme "rain" -- reading the mode
      // alone would paint the dark scheme's near-black and then swap to
      // overcast blue-grey on mount, which is the exact flash this exists to
      // stop. The class applied is the *scheme* name, never the mode: MUI puts
      // one scheme class on <html> and light/dark just happen to share a name
      // with their mode.
      (function () {
        try {
          // Hand the reader their own theme back, before anything reads the
          // keys below. A post can override the scheme while it is being read
          // (see usePostTheme), and MUI persists whatever is showing -- so a
          // tab closed mid-post leaves *the post's* theme in storage and the
          // reader's in "theme-handback". React cannot fix that: MUI has read
          // its keys by the time it mounts, and the page would have painted
          // the wrong scheme already. Restoring it here is what keeps a post's
          // theme from outliving the post.
          var owed = localStorage.getItem('theme-handback');
          if (owed === 'light' || owed === 'dark' || owed === 'rain') {
            localStorage.setItem('mui-mode', owed === 'light' ? 'light' : 'dark');
            localStorage.setItem(
              'mui-color-scheme-dark', owed === 'rain' ? 'rain' : 'dark'
            );
          }
          // Removed even when unreadable, so a value from some future scheme
          // cannot sit here forever pretending a hand-back is still pending.
          if (owed !== null) localStorage.removeItem('theme-handback');

          var mode = localStorage.getItem('mui-mode');
          if (mode === 'light') {
            document.documentElement.classList.add('light');
          } else if (mode === 'dark') {
            var scheme = localStorage.getItem('mui-color-scheme-dark');
            document.documentElement.classList.add(scheme === 'rain' ? 'rain' : 'dark');
          }
        } catch (e) {
          /* private mode / blocked storage: fall back to the media queries */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
