server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Vite emits content-hashed filenames, so these can be cached indefinitely.
  # A missing asset must 404 rather than fall through to the app shell,
  # otherwise a stale bundle request returns HTML and fails to parse.
  location /assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # The router lives in the client, so /about, /books, ... have no file on
  # disk. Anything that is not a real file is handed to the app shell and
  # resolved by react-router.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # The shell itself must never be cached, or a returning visitor gets an
  # old index.html pointing at asset hashes that no longer exist.
  location = /index.html {
    add_header Cache-Control "no-store";
  }

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml;
}
