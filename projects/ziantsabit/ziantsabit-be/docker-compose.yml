# `version:` is gone -- Compose v2 ignores it and warns that it is obsolete.
#
# The API only. Postgres and the S3-compatible bucket (RustFS) are separate
# servers that are not part of this stack, so their addresses and credentials
# come from a `.env` beside this file (gitignored) -- see .env.example.
# `${VAR:?message}` makes Compose refuse to start with a clear error rather
# than silently pointing the API at nothing.
services:
  api:
    build: .
    container_name: ziantsabit-be_api
    ports:
      - "8000:8000"
    environment:
      # `localhost` inside the container is the container itself. A server on
      # the Docker host is `host.docker.internal` (mapped below); anything else
      # by its address or hostname.
      POSTGRES_HOST: "${POSTGRES_HOST:?set POSTGRES_HOST to your Postgres server's address}"
      POSTGRES_PORT: "${POSTGRES_PORT:-5432}"
      POSTGRES_DB: "${POSTGRES_DB:-zian_tsabit_be}"
      POSTGRES_USER: "${POSTGRES_USER:-zian_tsabit_be}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}"
      # libpq semantics. `prefer` silently falls back to plaintext when the
      # server has no TLS; set `require` (encrypt) or `verify-full` (encrypt and
      # authenticate the server) once the connection crosses a network.
      POSTGRES_SSLMODE: "${POSTGRES_SSLMODE:-prefer}"
      # Only for verify-ca / verify-full: a path *inside the container*, so the
      # CA file has to be mounted in -- see the commented volume below.
      POSTGRES_SSLROOTCERT: "${POSTGRES_SSLROOTCERT:-}"

      # The bucket must already exist, be public-read on its objects, and allow
      # cross-origin GET -- nothing here creates or configures it any more.
      AWS_STORAGE_BUCKET_NAME: "${AWS_STORAGE_BUCKET_NAME:-ziantsabit-media}"
      # Named after the server's own RUSTFS_* keys, as the Django-era .env had them.
      AWS_S3_ACCESS_KEY_ID: "${RUSTFS_ACCESS_KEY:?set RUSTFS_ACCESS_KEY in .env}"
      AWS_S3_SECRET_ACCESS_KEY: "${RUSTFS_SECRET_KEY:?set RUSTFS_SECRET_KEY in .env}"
      # API -> storage, as the container reaches it.
      AWS_S3_ENDPOINT_URL: "${AWS_S3_ENDPOINT_URL:?set AWS_S3_ENDPOINT_URL to your RustFS S3 endpoint}"
      # browser -> storage, written into the URL of every upload. Differs from
      # the line above whenever the container reaches the bucket by a name the
      # browser cannot resolve (host.docker.internal, an internal IP). Getting
      # this wrong is invisible on upload and breaks every <img> on the site.
      AWS_S3_PUBLIC_ENDPOINT_URL: "${AWS_S3_PUBLIC_ENDPOINT_URL:-${AWS_S3_ENDPOINT_URL}}"

      # A fresh database has no account to write with. Set these to have one
      # created on startup; an existing account is never touched.
      ADMIN_USERNAME: "${ADMIN_USERNAME:-}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-}"
    extra_hosts:
      # Lets POSTGRES_HOST / AWS_S3_ENDPOINT_URL name a server running on the
      # Docker host itself. Docker Desktop provides this name already; on a
      # Linux engine it has to be mapped.
      - "host.docker.internal:host-gateway"
    # Uncomment together with POSTGRES_SSLROOTCERT=/etc/ssl/postgres-ca.crt in
    # .env to use verify-ca or verify-full.
    # volumes:
    #   - ./postgres-ca.crt:/etc/ssl/postgres-ca.crt:ro
    #
    # No depends_on: there is no database service to wait for. If Postgres is
    # still booting (after a host reboot, say), Flyway fails at startup, the
    # container exits, and `restart: unless-stopped` brings it back until it
    # connects -- expect a few restarts in the log rather than a clean boot.
    #
    # No source bind mount either: the jar is compiled into the image. For a
    # fast edit loop run `./gradlew bootRun` on the host instead.
    healthcheck:
      # The Temurin image ships curl. The health route is exempt from the
      # allowed-hosts check, so probing 127.0.0.1 works in production too.
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/actuator/health"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3
    restart: unless-stopped
