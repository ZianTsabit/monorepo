# In-namespace name for the RustFS server outside the cluster, so jobs say
# http://rustfs:9000. Same pattern as
# deployments/k8s/ziantsabit/base/external.yaml (where it's explained):
# a Service with no selector plus a hand-written EndpointSlice.
apiVersion: v1
kind: Service
metadata:
  name: rustfs
spec:
  ports:
    - name: s3
      port: 9000
      targetPort: 9000
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: rustfs
  labels:
    kubernetes.io/service-name: rustfs
    endpointslice.kubernetes.io/managed-by: spark-lab-manifests
addressType: IPv4
ports:
  - name: s3
    port: 9000
    protocol: TCP
endpoints:
  - addresses:
      - "192.168.0.111"
