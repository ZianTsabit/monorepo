# Not applied directly: the poller fills in ${ISSUE}, ${IMAGE}, ${REPO},
# ${OWNER_LOGIN} and ${NAMESPACE} with envsubst and creates one per issue.
apiVersion: batch/v1
kind: Job
metadata:
  name: agent-issue-${ISSUE}
  namespace: ${NAMESPACE}
  labels:
    app: agent-run
    issue: "${ISSUE}"
spec:
  backoffLimit: 0                  # a failed run is reported, not retried
  activeDeadlineSeconds: 3000      # 50 min; the agent itself stops at 40
  ttlSecondsAfterFinished: 604800  # keep logs for a week
  template:
    metadata:
      labels:
        app: agent-run
        issue: "${ISSUE}"
    spec:
      restartPolicy: Never
      serviceAccountName: agent-runner
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ghcr
      # Never on the control plane: an agent run that filled k8s-cp1's 2 GB
      # stalled the API server and CoreDNS and took the whole site down
      # (2026-11-07). Only nodes labelled agents=true take these Jobs.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - { key: node-role.kubernetes.io/control-plane, operator: DoesNotExist }
                  - { key: agents, operator: In, values: ["true"] }
      tolerations:
        - { key: agents, operator: Equal, value: "true", effect: NoSchedule }
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        runAsNonRoot: true
      volumes:
        - name: work
          emptyDir: { sizeLimit: 6Gi }
        - name: home
          emptyDir: {}
      # 1. The agent: Claude credential only.
      initContainers:
        - name: agent
          image: ${IMAGE}
          command: ["run-agent.sh"]
          env:
            - { name: ISSUE, value: "${ISSUE}" }
            - { name: REPO, value: "${REPO}" }
            - { name: OWNER_LOGIN, value: "${OWNER_LOGIN}" }
            # Every JVM (Gradle, its test workers) sizes its heap from the
            # container limit, so they fit side by side.
            - { name: JAVA_TOOL_OPTIONS, value: "-XX:MaxRAMPercentage=25" }
            - { name: NODE_OPTIONS, value: "--max-old-space-size=512" }
          envFrom:
            - secretRef:
                name: agents-claude
          volumeMounts:
            - { name: work, mountPath: /work }
            - { name: home, mountPath: /home/agent }
          # Request = limit: the scheduler only places a run where its whole
          # budget fits, instead of where 1 Gi fits and the rest is hoped for.
          resources:
            requests: { cpu: 500m, memory: 1792Mi }
            limits: { memory: 1792Mi }
      # 2. The publisher: GitHub token only; runs no agent-written code.
      containers:
        - name: publish
          image: ${IMAGE}
          command: ["publish.sh"]
          env:
            - { name: ISSUE, value: "${ISSUE}" }
            - { name: REPO, value: "${REPO}" }
            - name: GH_TOKEN
              valueFrom:
                secretKeyRef: { name: agents-github, key: token }
          volumeMounts:
            - { name: work, mountPath: /work }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }
