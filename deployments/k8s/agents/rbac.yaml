# The poller may manage Jobs in this namespace and nothing else. The agent's
# own pods get a ServiceAccount with no permissions and no token mounted:
# the code it runs never talks to the Kubernetes API.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: issue-poller
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: issue-poller
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: issue-poller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: issue-poller
subjects:
  - kind: ServiceAccount
    name: issue-poller
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-runner
automountServiceAccountToken: false
