# The Cloudflare Tunnel connector: prod's only way in from outside. Staging is
# not on it -- it is LAN-only, over NodePorts (../overlays/stg). It lives in its
# own namespace rather than prod's so that it can serve more environments later,
# and so tearing an environment down can't take the tunnel with it. Apply with `kubectl apply -k deployments/k8s/ziantsabit/cloudflared`.
#
# A remotely-managed tunnel -- its public hostnames are configured in the
# Cloudflare dashboard, and this only needs the tunnel token (Secret
# `cloudflared`, key `token`, created by hand). Public hostnames:
#
#   ziantsabit.com, www.ziantsabit.com -> http://ziantsabit-fe.ziantsabit-prod.svc.cluster.local:80
#   api.ziantsabit.com                 -> http://ziantsabit-be.ziantsabit-prod.svc.cluster.local:8000
#
# straight to the Services, not through Traefik -- see FORWARD_HEADERS_STRATEGY
# in ../base/ziantsabit-be.env for why the API's routes must not.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: cloudflared
spec:
  # Two connectors on different nodes, so draining one node keeps the site up.
  # Cloudflare balances between connectors of the same tunnel on its own.
  replicas: 2
  selector:
    matchLabels:
      app: cloudflared
  template:
    metadata:
      labels:
        app: cloudflared
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: cloudflared
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:2026.10.0
          args:
            - tunnel
            - --no-autoupdate
            # /ready answers 200 once the connector has a live connection to
            # Cloudflare's edge.
            - --metrics
            - 0.0.0.0:2000
            - run
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloudflared
                  key: token
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          livenessProbe:
            httpGet:
              path: /ready
              port: 2000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
