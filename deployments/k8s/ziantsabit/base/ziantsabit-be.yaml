# The API on the k3s cluster, shared by both environments. Apply an overlay,
# not this folder -- see ../README.md for the secrets that have to exist first.
#
# As with the compose stack, Postgres and RustFS are separate, already-running
# servers: nothing here creates the database or the bucket.
#
# The ConfigMap is generated by kustomization.yaml from ziantsabit-be.env here
# plus the overlay's own ziantsabit-be.env; the generated name carries a hash of
# the contents, so changing a value rolls this Deployment by itself.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ziantsabit-be
spec:
  # One pod: the comment and reaction rate limits are counted in memory, so N
  # replicas would allow N times the limit. Sessions are in Postgres and Flyway
  # takes a lock, so scaling up is otherwise safe.
  replicas: 1
  selector:
    matchLabels:
      app: ziantsabit-be
  template:
    metadata:
      labels:
        app: ziantsabit-be
    spec:
      # Uncomment if the GHCR package is private; see README.md beside this file.
      # imagePullSecrets:
      #   - name: ghcr
      securityContext:
        runAsUser: 1000
        runAsNonRoot: true
      containers:
        - name: api
          image: ghcr.io/ziantsabit/ziantsabit-be:1.0.0
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: ziantsabit-be
            # POSTGRES_PASSWORD, AWS_S3_ACCESS_KEY_ID, AWS_S3_SECRET_ACCESS_KEY,
            # optionally ADMIN_PASSWORD: whatever the backend's config/<env>.env
            # takes from Vault. Created with vault-env.sh -- see ../README.md.
            - secretRef:
                name: ziantsabit-be
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            # The Dockerfile sizes the heap at 75% of this.
            limits:
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
          # Spring Boot enables the liveness/readiness groups itself when it
          # detects Kubernetes. Both are under /actuator/health, which WebConfig
          # exempts from the allowed-hosts check, so probing by pod IP passes.
          startupProbe:
            # JVM start plus Flyway: up to three minutes before liveness counts.
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: ziantsabit-be
spec:
  # ClusterIP only: nothing outside the cluster reaches the API except through
  # the tunnel, which is what makes FORWARD_HEADERS_STRATEGY=native safe.
  selector:
    app: ziantsabit-be
  ports:
    - name: http
      port: 8000
      targetPort: http
